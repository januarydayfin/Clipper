# libs.versions.toml

[versions]
# Общие версии AndroidX/Google
activity = "1.11.0"
activityKtx = "1.11.0"
appcompat = "1.7.1"
coreKtx = "1.17.0"
lifecycle = "2.9.4" # Для lifecycle-viewmodel-ktx
lifecycleCompose = "2.9.4" # Для lifecycle-viewmodel-compose
material = "1.14.0-alpha05"
navigation = "2.9.5"
playReview = "2.0.2"
recyclerview = "1.4.0"
room = "2.8.1"

# Версии Compose
composeUi = "1.9.2" # Для ui-unit-android
composeUiTooling = "1.9.2" # Часто используется для ui-tooling
composeMaterial3 = "1.5.0-alpha04" # Обновил до более общей версии для Material3
adaptive = "1.1.0"

# Сторонние библиотеки
colorpicker = "2.3.0"
kotlinSerialization = "1.8.1"
tedpermission = "3.4.2"
zxing = "4.3.0"

# Версии для тестирования
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
uiTextGoogleFonts = "1.9.2"
composeMaterial3Version = "1.5.2"
pagingCommonAndroid = "3.3.6"

[libraries]
# --- AndroidX/Google ---

# Activity
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }

# App Compat & Core
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
google-play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "playReview" }

# Compose UI/Material
androidx-compose-ui-unit-android = { group = "androidx.compose.ui", name = "ui-unit-android", version.ref = "composeUi" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUiTooling" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "adaptive" }

# Lifecycle/ViewModel
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleCompose" }

# Navigation
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# Room (все три артефакта используют одну версию room)
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# --- Сторонние библиотеки ---
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerialization" }
tedpermission-normal = { group = "io.github.ParkSangGwon", name = "tedpermission-normal", version.ref = "tedpermission" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxing" }
skydoves-colorpickerview = { group = "com.github.skydoves", name = "colorpickerview", version.ref = "colorpicker" }

# --- Тестирование ---
junit-junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "uiTextGoogleFonts" }
androidx-paging-common-android = { group = "androidx.paging", name = "paging-common-android", version.ref = "pagingCommonAndroid" }


[bundles]
# Бандлы для удобного импорта групп зависимостей
room = ["androidx-room-paging", "androidx-room-runtime", "androidx-room-ktx"]
navigation = ["androidx-navigation-fragment-ktx", "androidx-navigation-ui-ktx"]
core = ["androidx-core-ktx", "androidx-appcompat", "androidx-recyclerview", "google-material", "androidx-lifecycle-viewmodel-ktx"]
compose = ["androidx-activity-compose", "androidx-compose-ui-unit-android", "androidx-compose-material3", "androidx-compose-ui-tooling-preview", "androidx-compose-material3-adaptive", "androidx-lifecycle-viewmodel-compose"]